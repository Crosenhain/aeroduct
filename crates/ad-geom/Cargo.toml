[package]
name = "ad-geom"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ad-gpu.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
log.workspace = true
rayon.workspace = true
pollster.workspace = true

[dev-dependencies]
env_logger.workspace = true

# The validation harness lives outside the crate, in `validation/geom`, because
# it is a cross-cutting check of the geometry pipeline rather than a unit test of
# any one module. Wiring it in as an explicit test target keeps it inside
# `cargo test --workspace`, which is where it has to run to be worth anything.
[[test]]
name = "geom_pseudonormal"
path = "../../validation/geom/pseudonormal.rs"

[[test]]
name = "geom_gpu_voxelize"
path = "../../validation/geom/gpu_voxelize.rs"

[[test]]
name = "geom_test_part"
path = "../../validation/geom/test_part.rs"
