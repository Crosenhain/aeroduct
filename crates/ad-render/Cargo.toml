[package]
name = "ad-render"
version.workspace = true
edition.workspace = true
license.workspace = true

# Deliberately depends only on `ad-gpu`.
#
# The render core consumes *textures and plain vertex data*, never solver or
# geometry types: derived fields arrive as 3D textures the solver fills, meshes
# arrive as `MeshData` slices. Keeping the dependency edge out means the render
# crate compiles, tests and profiles standalone, and that a change to the
# solver's internal representation cannot ripple into the renderer. See
# `fields::FieldSources` for the exact texture contract the solver must satisfy.
[dependencies]
ad-gpu.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
log.workspace = true

# The `preview` example renders one frame to a PNG so the output can actually be
# looked at, which is the only real acceptance test a renderer has.
[dev-dependencies]
env_logger.workspace = true
